apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api
  namespace: grade
spec:
  replicas: 8
  selector:
    matchLabels:
      app: grade-submission-api
  StrategyType: RollingUpdate
  RollingUpdateStrategy:  25% max unavailable, 25% max surge
  template:
    metadata:
      labels:
        app: grade-submission-api
    spec:
      containers:
        - name: grade-submission-api
          image: juzonb1r/my-website:1.0
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: grade-submission-api
  namespace: grade
spec:
  selector:
    app: grade-submission-api
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
